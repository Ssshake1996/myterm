# myterm's lean DeepSeek Harness ACP profile.
#
# DeepSeek Harness owns the Agent loop, durable session, compaction, goals and
# local Skill discovery. myterm owns every remote SSH/CLI/SFTP side effect and
# exposes those capabilities through the per-session Streamable HTTP MCP bridge.
# Local tools and remote tools coexist. Local tools are sandboxed and remote
# SSH/CLI/SFTP tools arrive through myterm's per-session MCP bridge.

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

- id: invariants
  name: '@deepseek-ai/dsh-invariants'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: !!js JSON.parse(process.env.MYTERM_HARNESS_PROVIDERS_JSON ?? '{}')

- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 40
    maxTitleBytes: 80

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.MYTERM_HARNESS_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.MYTERM_HARNESS_CWD ?? process.cwd()

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: terminal
  name: '@deepseek-ai/dsh-terminal'

- id: terminal-bash
  name: '@deepseek-ai/dsh-terminal-bash'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 300000

- id: terminal-pwsh
  name: '@deepseek-ai/dsh-terminal-bash'
  disabled: !!js process.platform !== 'win32'
  config:
    shellDialect: pwsh
    timeoutMs: 300000

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 300000

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: true
    includeRuntimeContext: false
    persona: !!js process.env.MYTERM_HARNESS_SYSTEM_PROMPT ?? ''

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js process.env.MYTERM_HARNESS_PERMISSION_MODE === 'danger-full-access' && 'never' || 'ask'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: session-checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'

- id: goal
  name: '@deepseek-ai/dsh-goal'

- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs: !!js JSON.parse(process.env.MYTERM_HARNESS_SKILL_DIRS_JSON ?? '[]')
    watch: true

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: acp
  name: '@deepseek-ai/dsh-acp'
  inject: [agents, llm, sessionPersistence, sessions]
  config:
    provider: !!js process.env.MYTERM_HARNESS_PROVIDER
    model: !!js process.env.MYTERM_HARNESS_MODEL
    sessionListPageSize: 100

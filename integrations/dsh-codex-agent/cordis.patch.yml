# Install this bundle after the selected Harness surface bundle. These rows
# disable every competing state owner and every default remote-capable route.
- id: agent-loop
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: session-checkpoint-policy
  disabled: true

- id: subagent
  disabled: true

- id: subagent-spawn-in-process
  disabled: true

- id: subagent-fork-in-process
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-subagent-report
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: code-runtime
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: credentials
  disabled: true

- id: session-title-llm
  disabled: true

- id: agent-default-model
  disabled: true

- id: llm-retry
  disabled: true

- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  disabled: true

- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

- insert:
    - id: codex-agent
      name: '@myterm/dsh-codex-agent'
      config:
        baseUrl: !!js process.env.INTRANET_LLM_BASE_URL
        model: !!js process.env.INTRANET_LLM_MODEL
        apiKeyEnv: INTRANET_LLM_API_KEY
        stateDir: !!js process.env.DSH_CODEX_STATE_DIR
        requestTimeoutMs: 120000
        contextWindowTokens: 128000
        compactThresholdTokens: 96000
        maxSteps: 64
        externalMcp: []

[package]
name = "dsh-codex-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Trimmed in-process Codex Core for DeepSeek Harness"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
napi = { version = "3.12.2", features = ["async", "serde-json", "tokio_rt"] }
napi-derive = "3.6.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
napi-build = "2.4.1"

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
# napi-rs generates the audited FFI shim; hand-written crate code has no unsafe blocks.
unsafe_code = "deny"

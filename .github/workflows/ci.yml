name: DSH Remote Ops CI

on:
  push:
  pull_request:

jobs:
  verify-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/dsh-remote-ops/package-lock.json
      - run: npm ci --prefix integrations/dsh-remote-ops
      - run: npm run check --prefix integrations/dsh-remote-ops
      - run: npm pack --prefix integrations/dsh-remote-ops --dry-run

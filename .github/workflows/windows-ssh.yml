name: Windows OpenSSH acceptance

on:
  push:
    branches: [main, codex/windows-openssh]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional published dsh-remote-ops-vX.Y.Z to install and verify
        type: string
        required: false

jobs:
  real-windows-ssh:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/dsh-remote-ops/package-lock.json
      - run: npm ci --prefix integrations/dsh-remote-ops
      - name: Full Windows regression gate
        run: npm run check --prefix integrations/dsh-remote-ops
      - name: Prepare isolated Microsoft OpenSSH binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path output/openssh-runtime -Force | Out-Null
          gh release download v9.8.3.0p2-Preview --repo PowerShell/Win32-OpenSSH --pattern OpenSSH-Win64.zip --dir output/openssh-runtime
          Expand-Archive -LiteralPath output/openssh-runtime/OpenSSH-Win64.zip -DestinationPath output/openssh-runtime
          $binary = (Resolve-Path output/openssh-runtime/OpenSSH-Win64/sshd.exe).Path
          $signature = Get-AuthenticodeSignature -LiteralPath $binary
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'OpenSSH signature verification failed' }
          'WINDOWS_OPENSSH_BIN=' + (Split-Path $binary) | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Real Windows Server PTY, exec, SFTP and log checks
        env:
          WINDOWS_SSH_PRODUCT_TYPE: '3'
          WINDOWS_SSH_OUTPUT: output/windows-ssh-live
        run: node integrations/dsh-remote-ops/test/windows-ssh-live.mjs
        timeout-minutes: 8
      - name: Prepare pinned DSH host and candidate package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE_OPS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          npm install --prefix output/dsh-host @deepseek-ai/dsh@0.2.0-rc.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path output/native-package -Force | Out-Null
          if ($env:REMOTE_OPS_RELEASE_TAG) {
            if ($env:REMOTE_OPS_RELEASE_TAG -notmatch '^dsh-remote-ops-v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
            gh release download $env:REMOTE_OPS_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*.tgz' --pattern 'SHA256SUMS-*.txt' --dir output/native-package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $archive = Get-ChildItem output/native-package -Filter *.tgz | Select-Object -First 1
            $checksum = Get-ChildItem output/native-package -Filter SHA256SUMS-*.txt | Select-Object -First 1
            $expected = ((Get-Content -LiteralPath $checksum.FullName -Raw).Trim() -split '\s+')[0]
            if ((Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.ToLowerInvariant()) { throw 'Release SHA256 mismatch' }
            'REMOTE_OPS_RELEASE_TAG=' + $env:REMOTE_OPS_RELEASE_TAG | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Push-Location integrations/dsh-remote-ops
            npm pack --pack-destination ../../output/native-package --silent
            Pop-Location
          }
          'DSH_CLI=' + (Join-Path $PWD 'output/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js') | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - name: Installed native DSH Windows and cross-conversation terminal acceptance
        shell: pwsh
        env:
          WINDOWS_NATIVE_OUTPUT: output/windows-native
        run: |
          $package = Get-ChildItem output/native-package -Filter *.tgz | Select-Object -First 1
          node e2e/runner/windows-native.mjs $package.FullName
        timeout-minutes: 10
      - run: npm ci --prefix e2e
      - name: Native DSH deferred hot reload and failed-startup recovery
        shell: pwsh
        env:
          HOT_RELOAD_OUTPUT: output/hot-reload-native
        run: |
          $package = Get-ChildItem output/native-package -Filter *.tgz | Select-Object -First 1
          node e2e/runner/hot-reload-native.mjs $package.FullName
        timeout-minutes: 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ssh-${{ matrix.os }}
          path: |
            output/windows-ssh-live/evidence.json
            output/windows-ssh-live/server/sshd.log
            output/windows-native/evidence.json
            output/windows-native/*.png
            output/windows-native/install.log
            output/windows-native/dsh.stderr.log
            output/hot-reload-native/evidence.json
            output/hot-reload-native/*.png
            output/hot-reload-native/install.log
            output/hot-reload-native/stderr.log
          if-no-files-found: warn

[package]
name = "myterm"
version = "0.11.5"
description = "A lightweight SSH terminal with a native AI assistant"
authors = ["myterm contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "myterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
axum = "0.8"
dirs = "6"
http = "1"
jsonschema = { version = "0.52.0", default-features = false }
keyring = "3"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rmcp = { version = "3.1.2", default-features = false, features = ["client", "server", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "transport-streamable-http-server-session", "reqwest-native-tls"] }
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled"] }
russh = "0.54"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
